<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ORG}} - Foster request</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;700&display=swap');
  :root { --cream:#fbf5e8; --ink:#183025; --green:#1b6744; --lime:#d7f27f; --peach:#ef9d72; --line:#d8d1c1; --muted:#667269; --mono:"DM Mono",monospace; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--cream); color:var(--ink); font-family:"Manrope",sans-serif; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at 90% 5%,rgba(239,157,114,.32),transparent 28%),radial-gradient(circle at 0 90%,rgba(215,242,127,.35),transparent 30%); }
  main { width:min(680px,100%); margin:auto; padding:24px 18px 70px; position:relative; }
  header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:32px; font:500 11px var(--mono); text-transform:uppercase; letter-spacing:.08em; }
  header span:last-child { border:1px solid var(--green); padding:7px 9px; }
  .dog { display:grid; grid-template-columns:150px 1fr; background:var(--ink); color:white; overflow:hidden; box-shadow:10px 10px 0 var(--lime); margin-bottom:34px; }
  .dog img { width:100%; height:100%; min-height:210px; object-fit:cover; }
  .dog-copy { padding:24px; }
  .eyebrow { font:500 10px var(--mono); text-transform:uppercase; letter-spacing:.12em; color:var(--lime); }
  h1 { font:600 clamp(40px,11vw,70px)/.9 "Fraunces",serif; margin:10px 0 13px; }
  .dog p { color:#cfdbd4; margin:0; line-height:1.55; }
  .card { background:rgba(255,255,255,.74); border:1px solid var(--line); padding:clamp(20px,5vw,32px); margin-top:17px; }
  .card h2 { font:600 27px "Fraunces",serif; margin:3px 0 17px; }
  .message { white-space:pre-wrap; line-height:1.7; }
  .facts { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:17px; }
  .fact { background:#f0ecdf; padding:12px; font-size:13px; }
  .fact b { display:block; font:500 9px var(--mono); text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  ul { padding-left:20px; line-height:1.65; }
  fieldset { border:0; padding:0; margin:0 0 20px; }
  legend,label.label { display:block; margin-bottom:9px; font:500 11px var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .answers { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .answer input { position:absolute; opacity:0; pointer-events:none; }
  .answer span { display:block; border:1px solid var(--ink); text-align:center; padding:15px 8px; font-weight:700; cursor:pointer; background:white; }
  .answer input:checked + span { background:var(--green); color:white; box-shadow:4px 4px 0 var(--lime); }
  .answer input:focus-visible + span { outline:3px solid var(--peach); outline-offset:3px; }
  select,textarea { width:100%; padding:13px; border:1px solid var(--line); background:white; color:var(--ink); font:inherit; margin-bottom:19px; }
  textarea { min-height:105px; resize:vertical; }
  button { width:100%; padding:15px; border:1px solid var(--green); color:white; background:var(--green); font:700 15px "Manrope",sans-serif; cursor:pointer; box-shadow:6px 6px 0 var(--lime); }
  button:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
  :focus-visible { outline:3px solid var(--peach); outline-offset:3px; }
  .result { border-left:5px solid var(--green); background:#edf7df; padding:18px; line-height:1.6; }
  .error { border-left-color:#a94838; background:#fff0e9; }
  .tag { display:inline-block; font:500 10px var(--mono); text-transform:uppercase; border:1px solid currentColor; padding:5px 7px; margin-bottom:8px; }
  [hidden] { display:none!important; }
  @media(max-width:470px) { .dog { grid-template-columns:1fr; } .dog img { height:190px; min-height:0; } .facts { grid-template-columns:1fr; } .dog-copy { padding:20px; } }
</style>
<link rel="stylesheet" href="/shelter.css" />
</head>
<body class="foster-response">
<main>
  <header><span>{{ORG}}</span><span>Secure demo response</span></header>
  <div id="loading" class="card">Opening your foster request...</div>
  <div id="content" hidden></div>
  <div id="fatal" class="card result error" hidden role="alert"></div>
</main>
<script>
const token=location.pathname.split('/').pop();
const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>new Intl.DateTimeFormat('en-US',{dateStyle:'full',timeStyle:'short',timeZone:'America/Los_Angeles'}).format(new Date(v));
let context;
async function load(){const res=await fetch(`/api/foster/respond/${token}`),data=await res.json();if(!res.ok)throw new Error(data.error);context=data.context;render()}
function render(){const {request:r,foster:f,preview:p,response}=context;document.querySelector('#loading').hidden=true;const el=document.querySelector('#content');el.hidden=false;el.innerHTML=`<section class="dog"><img src="${esc(r.dog.photoUrl)}" alt="${esc(r.dog.name)}, ${esc(r.dog.breed)}"><div class="dog-copy"><div class="eyebrow">Urgent foster / ${r.durationDays} nights</div><h1>Meet ${esc(r.dog.name)}.</h1><p>${esc(r.dog.summary)}</p></div></section><section class="card"><div class="eyebrow">For ${esc(f.displayName)}</div><h2>A note from the foster team</h2><div class="message">${esc(p.message)}</div><div class="facts"><div class="fact"><b>Foster dates</b>${fmt(r.start)}<br>to ${fmt(r.end)}</div><div class="fact"><b>Handoff</b>${esc(r.handoffLocation)}</div></div></section><section class="card"><div class="eyebrow">Care transparency</div><h2>What ${esc(r.dog.name)} needs</h2><ul>${r.dog.careNotes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></section><section class="card" id="responseCard">${response?`<div class="result"><span class="tag">Response recorded: ${esc(response.answer)}</span><br>Thanks, ${esc(f.displayName.split(' ')[0])}. Your answer is locked so staff can coordinate safely.${response.question?`<br><br><b>Your question:</b> ${esc(response.question)}`:''}</div>`:`<div class="eyebrow">Your response</div><h2>Could you foster ${esc(r.dog.name)}?</h2><form id="form"><fieldset><legend>Choose one</legend><div class="answers">${['yes','maybe','no'].map(a=>`<label class="answer"><input type="radio" name="answer" value="${a}" required><span>${a[0].toUpperCase()+a.slice(1)}</span></label>`).join('')}</div></fieldset><label class="label" for="slot">Preferred handoff time</label><select id="slot"><option value="">No preference</option>${r.handoffSlots.map(s=>`<option value="${s}">${fmt(s)}</option>`).join('')}</select><label class="label" for="question">Questions or concerns (optional)</label><textarea id="question" placeholder="Medication routine, dog-to-dog distance, timing..."></textarea><button type="submit">Send response to staff</button></form><div id="formError" class="result error" hidden role="alert"></div>`}</section>`;document.querySelector('#form')?.addEventListener('submit',submit)}
async function submit(e){e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;const answer=new FormData(e.currentTarget).get('answer');try{const res=await fetch(`/api/foster/respond/${token}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({answer,preferredSlot:document.querySelector('#slot').value,question:document.querySelector('#question').value})}),data=await res.json();if(!res.ok)throw new Error(data.error);context=data.context;render();document.querySelector('#responseCard').scrollIntoView({behavior:'smooth'})}catch(err){const box=document.querySelector('#formError');box.textContent=err.message;box.hidden=false;button.disabled=false}}
load().catch(err=>{document.querySelector('#loading').hidden=true;const box=document.querySelector('#fatal');box.textContent=err.message||'This response link is unavailable.';box.hidden=false});
</script>
</body>
</html>
